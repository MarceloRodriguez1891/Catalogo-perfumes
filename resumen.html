<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Resumen de pedidos</title>
<style>
:root{--ivory:#F7F2EA;--ink:#1E1519;--acc:#8A6431;--line:#E3D9C8;--mute:#7A6C60}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,Arial,sans-serif;background:var(--ivory);color:var(--ink);line-height:1.45}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 60px}
h1{font-family:Georgia,serif;font-size:32px;font-weight:600;margin-bottom:4px}
.sub{color:var(--mute);margin-bottom:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .full{grid-column:1/-1}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:3px}
input[type=text],input[type=password],input[type=date],textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:16px system-ui,Arial,sans-serif;background:#fff;color:var(--ink)}
textarea{height:170px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
button{border:0;border-radius:10px;padding:11px 16px;font:600 15px system-ui,Arial,sans-serif;cursor:pointer}
.go{background:var(--acc);color:#fff}.print{background:var(--ink);color:#fff}
.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.chips button{background:#fff;border:1px solid var(--line);color:var(--ink);padding:8px 12px;font-weight:500}
.msg{display:none;margin-top:10px;padding:10px 12px;border-radius:10px;background:#FBEFE6;color:#7a3b1b;font-size:14px}
.hide{display:none}
details summary{cursor:pointer;color:var(--mute);font-size:14px}
details[open] summary{margin-bottom:10px}
.sheet{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.sheet h2{font-family:Georgia,serif;font-size:24px;margin-bottom:2px}
.meta{color:var(--mute);font-size:14px;margin-bottom:12px}
.cl{border-top:1px solid var(--line);padding:8px 0;break-inside:avoid}
.cl h3{display:flex;justify-content:space-between;font-size:16px;margin-bottom:4px}
.cl h3 small{color:var(--mute);font-weight:400}
table{width:100%;border-collapse:collapse}
td,th{padding:4px 6px;text-align:left;font-size:15px}
th{font-size:13px;color:var(--mute);border-bottom:1px solid var(--line)}
td.b{width:28px;font-size:18px}td.q,th.q{text-align:right;width:70px;white-space:nowrap}
.del{padding:4px 10px;font-size:13px;background:#fff;border:1px solid #c9b7a8;color:#7a3b1b;margin-left:8px}
.tot{margin-top:12px;font-weight:700;text-align:right}
@media print{
  @page{margin:12mm}
  body{background:#fff}
  .noprint{display:none!important}
  .wrap{padding:0;max-width:none}
  .sheet{border:0;padding:0;margin:0 0 10mm}
  .sheet.pb{break-before:page}
}
</style></head><body><div class="wrap">
<div class="noprint">
<h1>Resumen de pedidos</h1>
<p class="sub">Elegí las fechas, cargá los pedidos guardados e imprimí la lista.</p>

<div class="card">
  <div class="grid">
    <div class="full" id="urlbox"><label for="url">Dirección del script (se pide una sola vez)</label><input type="text" id="url" placeholder="https://script.google.com/macros/s/…/exec"></div>
    <div class="full"><label for="clave">Clave</label><input type="password" id="clave" autocomplete="current-password"></div>
    <div><label for="desde">Desde</label><input type="date" id="desde"></div>
    <div><label for="hasta">Hasta</label><input type="date" id="hasta"></div>
  </div>
  <div class="row chips">
    <button type="button" data-r="hoy">Hoy</button>
    <button type="button" data-r="ayer">Ayer</button>
    <button type="button" data-r="semana">Esta semana</button>
    <button type="button" data-r="sempas">Semana pasada</button>
  </div>
  <div class="row"><button class="go" id="load">Cargar pedidos</button></div>
  <div class="msg" id="msg"></div>
</div>

<details class="card">
  <summary>Resumir mensajes pegados de WhatsApp (para pedidos viejos)</summary>
  <textarea id="t" placeholder="Pegá acá los mensajes de pedidos…"></textarea>
  <div class="row"><button class="ghost" id="paste">Armar con lo pegado</button></div>
</details>
</div>

<div id="out"></div>
<div class="row noprint hide" id="pr"><button class="print" id="prbtn">Imprimir</button></div>
</div>

<script>
var SCRIPT_URL="https://script.google.com/macros/s/AKfycbxBgjja0v5357EOLMuyQe8PczkRodQ0re5ZFGOXbTpiQaUpGNLPPFs_zkaDvxOrk8rBuw/exec";   // se completa con la dirección del script de Google (termina en /exec)
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function norm(s){return s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase()}
function iso(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
function fmt(s){var p=s.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function msg(t){var m=$("msg");if(!t){m.style.display="none";return}m.textContent=t;m.style.display="block"}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k)||"";localStorage.setItem(k,v)}catch(e){return ""}}

// ---- ajustes guardados en este navegador
if(SCRIPT_URL){$("urlbox").classList.add("hide")}else{$("url").value=ls("res_url")}
$("clave").value=ls("res_clave");
$("desde").value=$("hasta").value=iso(new Date());

// ---- atajos de fechas
document.querySelector(".chips").addEventListener("click",function(e){
  var r=e.target.getAttribute("data-r");if(!r)return;
  var n=new Date(),dow=(n.getDay()+6)%7,a,b;   // lunes=0
  if(r=="hoy"){a=b=n}
  else if(r=="ayer"){a=b=new Date(n.getFullYear(),n.getMonth(),n.getDate()-1)}
  else if(r=="semana"){a=new Date(n.getFullYear(),n.getMonth(),n.getDate()-dow);b=n}
  else{a=new Date(n.getFullYear(),n.getMonth(),n.getDate()-dow-7);b=new Date(n.getFullYear(),n.getMonth(),n.getDate()-dow-1)}
  $("desde").value=iso(a);$("hasta").value=iso(b)});

// ---- armar las hojas a partir de pedidos [{who, hora, items:[{n,q}]}]
function build(orders,titulo,noscroll){
  var out=$("out"),pr=$("pr");
  if(!orders.length){out.innerHTML="";pr.classList.add("hide");msg("No hay pedidos en ese período.");return}
  msg("");
  var tot={},sum=0;
  orders.forEach(function(o){o.items.forEach(function(it){tot[it.n]=(tot[it.n]||0)+it.q;sum+=it.q})});
  var keys=Object.keys(tot).sort(function(a,b){return norm(a)<norm(b)?-1:1});
  var h='<div class="sheet"><h2>Pedidos por cliente</h2><div class="meta">'+esc(titulo)+' · '+orders.length+' pedidos · '+sum+' unidades</div>';
  orders.forEach(function(o,i){
    var n=0;o.items.forEach(function(it){n+=it.q});
    h+='<div class="cl"><h3><span>'+(i+1)+'. '+esc(o.who||"Cliente "+(i+1))+'</span><div><small>'+(o.hora?esc(o.hora)+' · ':'')+n+' u.</small>'+(o.id?'<button type="button" class="del noprint" data-id="'+esc(o.id)+'">Borrar</button>':'')+'</div></h3><table>'+
      o.items.map(function(it){return '<tr><td class="b">☐</td><td>'+esc(it.n)+'</td><td class="q">× '+it.q+'</td></tr>'}).join("")+'</table></div>'});
  h+='</div><div class="sheet pb"><h2>Total para preparar</h2><div class="meta">'+esc(titulo)+' · '+keys.length+' productos · '+sum+' unidades</div><table><tr><th></th><th>Producto</th><th class="q">Cant.</th></tr>'+
    keys.map(function(k){return '<tr><td class="b">☐</td><td>'+esc(k)+'</td><td class="q">'+tot[k]+'</td></tr>'}).join("")+
    '</table><div class="tot">Total: '+sum+' unidades</div></div>';
  out.innerHTML=h;pr.classList.remove("hide");if(!noscroll)out.scrollIntoView({behavior:"smooth"})}

// ---- cargar desde la planilla
function cfg(){
  var url=SCRIPT_URL||$("url").value.trim(),clave=$("clave").value,a=$("desde").value,b=$("hasta").value;
  if(!url){msg("Falta la dirección del script.");return null}
  if(!clave){msg("Escribí la clave.");return null}
  if(!a||!b){msg("Elegí las dos fechas.");return null}
  if(a>b){var x=a;a=b;b=x;$("desde").value=a;$("hasta").value=b}
  if(!SCRIPT_URL)ls("res_url",url);ls("res_clave",clave);
  return {url:url,clave:clave,a:a,b:b}}
// devuelve una promesa con la lista de ids de pedidos mostrados (o null si falló)
function cargar(chequeo){
  var c=cfg();if(!c)return Promise.resolve(null);
  msg("Cargando…");
  return fetch(c.url+"?clave="+encodeURIComponent(c.clave)+"&desde="+c.a+"&hasta="+c.b)
    .then(function(r){return r.json()})
    .then(function(d){
      if(!d.ok){msg(d.error=="clave"?"La clave no es correcta.":"No se pudo leer la planilla.");return null}
      var map={},orders=[];
      d.filas.forEach(function(f){
        var o=map[f.pedido];
        if(!o){o={id:f.pedido,who:f.cliente,hora:f.fecha.substring(11,16),dia:f.fecha.substring(0,10),items:[]};map[f.pedido]=o;orders.push(o)}
        o.items.push({n:f.producto,q:f.cantidad})});
      if(c.a!==c.b)orders.forEach(function(o){o.hora=o.dia.substring(8,10)+"/"+o.dia.substring(5,7)+" "+o.hora});
      build(orders,c.a===c.b?fmt(c.a):fmt(c.a)+" al "+fmt(c.b),!!chequeo);
      return orders.map(function(o){return o.id})})
    .catch(function(){msg("No se pudo conectar. Revisá la dirección del script y tu conexión.");return null})}
$("load").onclick=function(){cargar()};

// ---- borrar un pedido de la planilla
$("out").addEventListener("click",function(e){
  var b=e.target.closest(".del");if(!b)return;
  if(!confirm("¿Borrar este pedido de la planilla? No se puede deshacer."))return;
  var id=b.getAttribute("data-id"),c=cfg();if(!c)return;
  msg("Borrando…");
  fetch(c.url,{method:"POST",body:JSON.stringify({accion:"borrar",clave:c.clave,pedido:id})})
    .catch(function(){})
    .then(function(){return cargar(true)})
    .then(function(ids){
      if(ids===null)return;
      msg(ids.indexOf(id)>-1?"No se pudo borrar. Probá de nuevo.":"Pedido borrado.")})});

// ---- modo pegado (pedidos viejos de WhatsApp)
function parse(txt){
  txt=txt.replace(/\r/g,"").replace(/[‎‏‪-‮]/g,"");
  var re=/quiero hacer este pedido/ig,starts=[],m;
  while((m=re.exec(txt))){starts.push({line:txt.lastIndexOf("\n",m.index)+1,at:m.index})}
  var orders=[];
  for(var i=0;i<starts.length;i++){
    var s=starts[i],end=i+1<starts.length?starts[i+1].line:txt.length;
    var head=txt.slice(s.line,s.at),body=txt.slice(s.at,end).split("\n").slice(1),sender="";
    var hm=head.match(/^\s*\[?[^\]\-]*?\d{1,2}[:.]\d{2}[^\]\-:]*\]?\s*[-–]?\s*([^:]{1,40}):\s*/);
    if(hm)sender=hm[1].trim();
    var name="",items=[];
    body.forEach(function(l){
      var t=l.trim();if(!t)return;
      var nm=t.match(/^nombre\s*:\s*(.+)$/i);if(nm){name=nm[1].trim();return}
      var im=t.match(/^[•\-\*·●▪]?\s*(.+?)\s+[x×]\s*(\d+)\s*$/i);
      if(im)items.push({n:im[1].trim(),q:parseInt(im[2],10)})});
    if(items.length)orders.push({who:name||sender,items:items})}
  return orders}
try{$("t").value=localStorage.getItem("pedidos_txt")||""}catch(e){}
$("t").addEventListener("input",function(){ls("pedidos_txt",$("t").value)});
$("paste").onclick=function(){build(parse($("t").value),fmt(iso(new Date())))};
$("prbtn").onclick=function(){window.print()};
</script></body></html>
